<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tilewar</title>
  <meta name="description" content="A real-time shared grid. Claim tiles and watch everyone else do the same.">
  <meta name="theme-color" content="#0f1117">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1117'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2' fill='%23ec4899'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2' fill='%2306b6d4'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2' fill='%2322c55e'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2' fill='%23f59e0b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <h1>Tilewar</h1>
      </div>
      <div class="topbar-right">
        <span class="pill" id="online-pill" title="Players online"><span class="dot"></span><b id="online-count">0</b> online</span>
        <span class="pill status" id="status" data-state="connecting"><span class="dot"></span><span id="status-text">Connecting…</span></span>
      </div>
    </header>

    <main class="stage" id="stage">
      <canvas id="board" tabindex="0" aria-label="Shared tile grid. Click or press Enter to claim a tile; arrow keys move the cursor."></canvas>
      <div class="tooltip" id="tooltip" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <div class="zoom" aria-label="View controls">
        <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="zoom-fit" title="Fit to screen" aria-label="Fit to screen">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
      <div class="hint" id="hint">Scroll to zoom · drag to pan · click a tile to claim it</div>
    </main>

    <aside class="side">
      <section class="card you">
        <div class="card-head"><h2>You</h2><span class="muted" id="you-count">0 tiles</span></div>
        <div class="name-row">
          <span class="swatch-me" id="me-swatch"></span>
          <input id="name-input" type="text" maxlength="16" spellcheck="false" autocomplete="off" aria-label="Your name">
        </div>
        <div class="colors" id="colors" role="radiogroup" aria-label="Your colour"></div>
        <div class="cooldown" id="cooldown" aria-hidden="true"><div class="cooldown-fill" id="cooldown-fill"></div></div>
        <div class="muted small" id="cooldown-text">Ready to claim</div>
      </section>

      <section class="card">
        <div class="card-head"><h2>Territory</h2><span class="muted" id="claimed-count">0 / 0</span></div>
        <div class="progress"><div class="progress-fill" id="claimed-bar"></div></div>
        <ol class="board-list" id="leaderboard"></ol>
      </section>

      <section class="card feed-card">
        <div class="card-head"><h2>Activity</h2></div>
        <ul class="feed" id="feed"></ul>
      </section>
    </aside>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
